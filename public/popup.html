<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nudgememaybe</title>
    <link rel="stylesheet" href="pico.min.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container-fluid">
      <h4>nudgememaybe</h4>

      <section>
        <form id="add-form">
          <label for="label">Label</label>
          <input
            id="label"
            name="label"
            type="text"
            required
            maxlength="200"
            placeholder="Oven, game claim, …"
            autocomplete="off"
            aria-describedby="label-helper"
          />
          <small id="label-helper" hidden></small>

          <label for="when">When</label>
          <input id="when" name="when" type="datetime-local" required aria-describedby="when-helper" />          
          <small id="when-helper" hidden></small>

          <div role="group" data-group-size="small">
            <button type="button" class="outline" data-preset="-60">
              -1h
            </button>
            <button type="button" class="outline" data-preset="-10">
              -10m
            </button>
            <button type="button" class="outline" data-preset="-1">
              -1m
            </button>
            <button type="button" class="outline" data-preset="1">
              +1m
            </button>
            <button type="button" class="outline" data-preset="10">
              +10m
            </button>
            <button type="button" class="outline" data-preset="60">
              +1h
            </button>
          </div>

          <button type="submit">Add alarm</button>
        </form>
      </section>

      <section>
        <h6>UPCOMING ALARMS</h6>
        <div id="alarm-list"></div>
      </section>

      <button id="open-history" type="button" class="secondary">
        Open history
      </button>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
