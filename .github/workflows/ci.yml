name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default GITHUB_TOKEN to least privilege (public repos + fork PRs stay read-only for contents).
permissions:
  contents: read

jobs:
  test:
    # Do not run on pull requests from forks (avoids untrusted code execution on your runners/minutes).
    # Same-repo PRs, pushes to main, and Dependabot still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Pinned SHAs limit supply-chain risk if a tag is retargeted. Bump intentionally when upgrading.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Install Playwright Chromium and OS dependencies
        run: bunx playwright install --with-deps chromium

      # Extensions need a display; headed Chromium under xvfb-run is the standard Linux CI pattern.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: End-to-end tests
        run: xvfb-run -a bun run test:e2e
