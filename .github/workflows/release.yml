name: Create release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify package.json version matches tag
        run: |
          pkg=$(jq -r .version package.json)
          tag="${GITHUB_REF_NAME}"
          expected="v${pkg}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag is \"$tag\" but package.json version is \"$pkg\" (expected tag \"$expected\")"
            exit 1
          fi
          echo "Version OK: tag \"$tag\" matches package.json version \"$pkg\""

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and compress
        run: bun run pack

      - name: Release
        uses: cemreyavuz/create-release-with-assets@9d3bfd9ffe2bd4a510c8f0116172b94176f659e2
        with:
          files: nudgememaybe-${{ github.ref_name }}.zip
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
